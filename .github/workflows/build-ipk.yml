name: Build OpenWrt IPK

on:
  push:
    paths:
      - 'netlogin_openwrt.sh'
      - 'package/netlogin-nxu/**'
      - '.github/workflows/build-ipk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the current OpenWrt script
        run: test -x netlogin_openwrt.sh

      - name: Build package with the OpenWrt SDK
        uses: openwrt/gh-action-sdk@v8
        env:
          # Pin the SDK release so the output remains compatible with
          # OpenWrt/iStoreOS 24.10 and uses the expected .ipk format.
          ARCH: x86_64-24.10.2
          FEEDNAME: netlogin
          # luci-app-netlogin-nxu is a subpackage in the netlogin-nxu Makefile.
          PACKAGES: netlogin-nxu
          V: s

      - name: List generated IPK files
        run: |
          mkdir -p artifacts
          find . -type f -name '*.ipk' -print
          find . -type f -name '*.ipk' -exec cp '{}' artifacts/ \;
          test -n "$(find artifacts -type f -name '*.ipk' -print -quit)"

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: netlogin-nxu-ipk
          path: artifacts/*.ipk
          if-no-files-found: error
